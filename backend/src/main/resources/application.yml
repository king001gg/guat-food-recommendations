server:
  port: 8080

spring:
  # 默认 dev 环境使用 H2
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置 (secret 通过环境变量 JWT_SECRET 注入；未配置时启动时生成临时随机密钥)
jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000  # 7 天 (毫秒)

# 种子账号初始密码 (通过环境变量 INIT_PASSWORD 注入；未配置时启动时随机生成并打印到日志)
init:
  password: ${INIT_PASSWORD:}

# 文件上传
upload:
  path: ./uploads/
  max-size: 5242880  # 5MB
