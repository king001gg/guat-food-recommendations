spring:
  datasource:
    url: jdbc:h2:mem:guatfood-test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

app:
  seed:
    enabled: false
  audit:
    enabled: true
    retention-days: 180
  security:
    rate-limit:
      enabled: true
      # 默认放宽，避免不同测试方法互相干扰；限流测试类会覆盖为低阈值
      login-ip-per-minute: 1000
      login-user-failures: 1000
      login-user-window-seconds: 900
      register-ip-per-hour: 1000
      register-ip-per-day: 1000
      upload-user-per-minute: 1000
      rating-user-per-minute: 1000
      trusted-proxies: 127.0.0.1,::1

jwt:
  secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef
  expiration: 604800000

init:
  password: TestAdmin-2026!

upload:
  path: ./target/test-uploads/

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: WARN
    com.guatfood: INFO
