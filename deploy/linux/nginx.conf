# 桂航美食推荐排行榜 - Nginx 配置（单 jar 反向代理 + HTTPS）
# 后端 jar 已内置前端页面与 SPA 回退，Nginx 负责 TLS 终止、安全响应头与反向代理。
#
# 安装：
#   sudo cp nginx.conf /etc/nginx/sites-available/guatfood
#   sudo ln -s /etc/nginx/sites-available/guatfood /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 将 your-domain.com 替换为你的域名。

server {
    listen 80;
    server_name your-domain.com;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    # SSL 证书（acme.sh 或云厂商免费证书）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传大小上限（与后端 20MB 保持一致）
    client_max_body_size 20m;

    # 全部反向代理到后端（内置前端 + /api + /uploads + SPA 回退）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
