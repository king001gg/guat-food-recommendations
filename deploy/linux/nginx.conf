# 桂航美食推荐排行榜 - Nginx 配置（单 jar 反向代理 + HTTPS）
# 后端 jar 已内置前端页面与 SPA 回退，Nginx 负责 TLS 终止、安全响应头、压缩与反向代理。
#
# 安装：
#   sudo cp nginx.conf /etc/nginx/sites-available/guatfood
#   sudo ln -s /etc/nginx/sites-available/guatfood /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 将 your-domain.com 替换为你的域名。

# 单 IP 基础限流（后端还有登录/注册/上传等业务级限额）
limit_req_zone $binary_remote_addr zone=guatfood_req:10m rate=30r/s;

server {
    listen 80;
    server_name your-domain.com;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    # 压缩：JSON/JS/CSS 等文本响应。
    # 放在 server 内而不是文件顶层：站点文件被 include 进 http{}，
    # 发行版默认 nginx.conf 已有 "gzip on;"，同上下文重复会导致 nginx -t 失败。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               image/svg+xml;

    # SSL 证书（acme.sh 或云厂商免费证书）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（location 内不要再用 add_header，否则会丢失这些继承的头）
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 上传大小上限（与后端 max-request-size 20MB 保持一致）
    client_max_body_size 20m;

    # 管理端口只监听回环，这里再做一层防御性屏蔽
    location ^~ /actuator {
        return 404;
    }

    # 生产不暴露 H2 控制台
    location ^~ /h2-console {
        return 404;
    }

    # 前端构建产物带内容 hash，可长期缓存
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
    }

    # 入口 HTML 不缓存，保证发版后立即拿到新版本
    location = /index.html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires -1;
    }

    # 全部反向代理到后端（内置前端 + /api + /uploads + SPA 回退）
    location / {
        limit_req zone=guatfood_req burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
