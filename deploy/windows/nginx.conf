# Nginx for Windows 部署配置（可选方案：前端与后端分离）
# 下载 Nginx for Windows（http://nginx.org/en/download.html）后，
# 用本文件替换 conf/nginx.conf，并按需修改 root 路径。
#
# 启动：nginx.exe         重载：nginx.exe -s reload         停止：nginx.exe -s stop

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ---- 压缩 ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript application/xml
                      image/svg+xml;

    # 单 IP 接口限流（后端还有登录/注册/上传等业务级限额）
    limit_req_zone $binary_remote_addr zone=guatfood_api:10m rate=20r/s;

    server {
        listen       80;
        server_name  localhost;
        server_tokens off;

        # 基础安全响应头（HTTP 方案无法启用 HSTS；对外请使用 HTTPS）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        # 前端构建产物目录（改成你实际的 dist 路径）
        root   C:/guatfood/frontend/dist;
        index  index.html;

        # 上传大小上限，与后端 application.yml 的 max-request-size 保持一致
        # （不配则 Nginx 默认 1MB，稍大的菜品图片会直接 413）
        client_max_body_size 20m;

        # 管理端口只监听回环；这里再做一层防御性屏蔽
        location ^~ /actuator {
            return 404;
        }

        # 前端 SPA（history 模式必须）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite 构建产物带内容 hash，可长期缓存；缺失文件返回 404 而不是 index.html
        # 注意：location 内一旦出现 add_header，就不会继承 server 级安全头，因此这里重复声明
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
            try_files $uri =404;
        }

        # 入口 HTML 不缓存，保证发版后浏览器立即拿到新版本
        location = /index.html {
            expires -1;
        }

        # 后端接口
        location /api/ {
            limit_req zone=guatfood_api burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 上传的图片：后端按 UUID 命名，URL 不变则内容不变，可放心缓存
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
        }
    }
}
