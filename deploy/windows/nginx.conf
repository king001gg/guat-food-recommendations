# Nginx for Windows 部署配置（可选方案：前端与后端分离）
# 下载 Nginx for Windows（http://nginx.org/en/download.html）后，
# 用本文件替换 conf/nginx.conf，并按需修改 root 路径。
#
# 启动：nginx.exe         重载：nginx.exe -s reload         停止：nginx.exe -s stop

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 前端构建产物目录（改成你实际的 dist 路径）
        root   C:/guatfood/frontend/dist;
        index  index.html;

        # 前端 SPA（history 模式必须）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端接口
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 上传的图片
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }
    }
}
